name: Live CivicClerk acceptance probe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mitchell-sea-2026-08-18:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run contract tests
        run: npm test

      - name: Run live Mitchell CivicClerk probe
        run: |
          node src/cli.mjs \
            --tenant mitchellsd \
            --body "Sports & Events Authority" \
            --date 2026-08-18 \
            > probe.json

      - name: Read Cornicupia budget PDF
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { readCivicClerkAttachment, selectAttachmentById } from './src/document-reader.mjs';
          const data = JSON.parse(fs.readFileSync('probe.json', 'utf8'));
          const attachment = selectAttachmentById(data.agendaItems || [], 11012);
          if (!attachment) throw new Error('Cornicupia 2026 Event Budget attachment 11012 missing');
          const document = await readCivicClerkAttachment(attachment);
          fs.writeFileSync('cornicupia-budget.json', JSON.stringify(document, null, 2));
          console.log(JSON.stringify({
            attachmentId: document.attachmentId,
            fileName: document.fileName,
            agendaItemId: document.agendaItemId,
            status: document.status,
            pageCount: document.pageCount,
            characters: document.characters,
            byteLength: document.byteLength,
            contentType: document.contentType,
            sha256: document.sha256,
            preview: document.text.slice(0, 2500)
          }, null, 2));
          NODE

      - name: Assert Aug. 18 SEA source custody and document reading
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const data = JSON.parse(fs.readFileSync('probe.json', 'utf8'));
          const document = JSON.parse(fs.readFileSync('cornicupia-budget.json', 'utf8'));
          const files = data.event?.publishedFiles || [];
          const minute = data.minutesFile || files.find(f => /minutes/i.test(`${f.type || ''} ${f.name || ''}`));
          const allIds = files.map(f => Number(f.fileId ?? f.file_id ?? f.id));

          if (!minute) throw new Error('No minutes file selected');
          const minuteId = Number(minute.fileId ?? minute.file_id ?? minute.id);
          if (minuteId !== 5349) throw new Error(`Expected minutes file 5349, got ${minuteId}`);
          if (!allIds.includes(5344)) throw new Error('Agenda file 5344 missing');
          if (!allIds.includes(5346)) throw new Error('Agenda Packet file 5346 missing');
          if (!allIds.includes(5349)) throw new Error('Minutes file 5349 missing');

          const eventId = data.event?.id;
          const agendaId = data.event?.agendaId ?? data.agenda?.id;
          if (eventId !== 1540) throw new Error(`Expected event 1540, got ${eventId}`);
          if (agendaId !== 1509) throw new Error(`Expected agenda 1509, got ${agendaId}`);

          const minutesText = data.minutesText ?? '';
          if (typeof minutesText !== 'string' || minutesText.trim().length < 1000) {
            throw new Error('Minutes text missing or unexpectedly short');
          }
          if (!minutesText.includes('Cornicupia 2026')) throw new Error('Expected Cornicupia 2026 in minutes');
          if (!minutesText.includes('referee fees')) throw new Error('Expected referee-fee text in minutes');

          const items = data.agendaItems ?? [];
          if (!Array.isArray(items) || items.length === 0) throw new Error('Structured agenda items missing');
          const attachments = items.flatMap(item => item.attachments ?? []);
          if (!attachments.some(a => Number(a.id) === 11012)) throw new Error('Cornicupia budget attachment missing from structured agenda');

          if (document.attachmentId !== 11012) throw new Error(`Expected attachment 11012, got ${document.attachmentId}`);
          if (document.agendaItemId !== 10930) throw new Error(`Expected Cornicupia agenda item 10930, got ${document.agendaItemId}`);
          if (document.status !== 'text_extracted') throw new Error(`PDF did not yield usable text: ${document.status}`);
          if (!Number.isInteger(document.pageCount) || document.pageCount < 1) throw new Error('PDF page count missing');
          if (!Number.isInteger(document.characters) || document.characters < 100) throw new Error(`PDF text unexpectedly short: ${document.characters}`);
          if (!/^[a-f0-9]{64}$/.test(document.sha256 || '')) throw new Error('PDF SHA-256 missing');
          if (!Array.isArray(document.pages) || document.pages.length < 1) throw new Error('Per-page text missing');

          console.log(JSON.stringify({
            ok: true,
            eventId,
            agendaId,
            minuteId,
            publishedFileIds: allIds,
            minutesCharacters: minutesText.length,
            agendaItems: items.length,
            attachments: attachments.length,
            document: {
              attachmentId: document.attachmentId,
              fileName: document.fileName,
              pageCount: document.pageCount,
              characters: document.characters,
              byteLength: document.byteLength,
              sha256: document.sha256
            }
          }, null, 2));
          NODE

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mitchell-sea-2026-08-18-probe
          path: |
            probe.json
            cornicupia-budget.json
          if-no-files-found: ignore
